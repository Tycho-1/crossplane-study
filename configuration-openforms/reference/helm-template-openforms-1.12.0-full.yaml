# Source: openforms/charts/redis/templates/scripts-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-redis-scripts
  namespace: "openforms"
  labels:
    app.kubernetes.io/instance: demo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 8.2.0
    helm.sh/chart: redis-22.0.1
data:
  start-master.sh: |
    #!/bin/bash

    [[ -f $REDIS_PASSWORD_FILE ]] && export REDIS_PASSWORD="$(< "${REDIS_PASSWORD_FILE}")"
    if [[ -f /opt/bitnami/redis/mounted-etc/master.conf ]];then
        cp /opt/bitnami/redis/mounted-etc/master.conf /opt/bitnami/redis/etc/master.conf
    fi
    if [[ -f /opt/bitnami/redis/mounted-etc/redis.conf ]];then
        cp /opt/bitnami/redis/mounted-etc/redis.conf /opt/bitnami/redis/etc/redis.conf
    fi
    if [[ -f /opt/bitnami/redis/mounted-etc/users.acl ]];then
        cp /opt/bitnami/redis/mounted-etc/users.acl /opt/bitnami/redis/etc/users.acl
    fi
    ARGS=("--port" "${REDIS_PORT}")
    ARGS+=("--protected-mode" "no")
    ARGS+=("--include" "/opt/bitnami/redis/etc/redis.conf")
    ARGS+=("--include" "/opt/bitnami/redis/etc/master.conf")
    exec redis-server "${ARGS[@]}"
---
# Source: openforms/templates/configmap-nginx.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-openforms-nginx
  labels:
    helm.sh/chart: openforms-1.12.0
    app.kubernetes.io/instance: demo
    app.kubernetes.io/name: demo-openforms-nginx
data:
  proxy: |
    proxy_pass_header Server;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
    proxy_redirect off;
    proxy_pass_request_headers on;
    proxy_http_version 1.1;
    proxy_pass http://demo-openforms.openforms:80;
    proxy_set_header Host $http_host;

  default.conf: |
    # Rate limiting configuration - allow 1 request per second. 10m can track about 80000 clients.
    limit_req_zone $binary_remote_addr zone=demo-openforms.openforms_discover:10m rate=1r/s;

    

    server {
        listen 8080 default_server;
        server_name  localhost;
        server_tokens off;
        client_max_body_size 10M;

        gzip  on;
        gzip_http_version 1.0;
        gzip_comp_level 2;
        gzip_min_length 1100;
        gzip_buffers     4 8k;
        gzip_proxied any;
        gzip_types

          # text/html is always compressed by HttpGzipModule
          text/css
          text/javascript
          text/xml
          text/plain
          text/x-component
          application/javascript
          application/json
          application/xml
          application/rss+xml
          font/truetype
          font/opentype
          application/vnd.ms-fontobject
          image/svg+xml;

        gzip_static on;

        gzip_proxied        expired no-cache no-store private auth;
        gzip_disable        "MSIE [1-6]\.";
        gzip_vary           on;

        location / {
            include conf.d/proxy;
        }

        location /_health/ {
            access_log /var/log/nginx/access.log;
            error_log /var/log/nginx/error.log error;
            return 200 'OK';
        }

      location /private-media {
          internal;
          alias /app/private_media/;
      }

      location /media {
          alias /app/media/;
      }

      location = /api/v1/formio/fileupload {
        client_max_body_size 50M;
        include conf.d/proxy;
      }

      location = /admin/forms/form/import/ {
        client_max_body_size 20M;
        include conf.d/proxy;
      }

      # Serve collected static files directly from Nginx
      location /static/ {
          expires max;
          add_header Access-Control-Allow-Origin *;
          alias /srv/static/;
          include /etc/nginx/mime.types;
          types {
            application/javascript mjs;
          }
      }

      # Metadata endpoints - rate limit them to prevent abuse, as they generate XML
      # on the fly.
      location /discovery/ {
          # rate limit at 1 request/s, but allow (delayed) burst of 5 requests
          limit_req zone=demo-openforms.openforms_discover burst=5;
          include conf.d/proxy;
      }

    }
---
