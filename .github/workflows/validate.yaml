name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install yamllint
      - run: yamllint --format github .

  kubeconform:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
      # Core Kubernetes kinds are validated strictly; Crossplane and provider CRDs are
      # validated when the community CRDs-catalog has a schema for them, skipped otherwise.
      - name: Validate manifests
        run: |
          git ls-files '*.yaml' | grep -vE '^\.github/|^\.yamllint\.yaml$' | xargs kubeconform \
            -summary -strict -ignore-missing-schemas \
            -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  render:
    runs-on: ubuntu-latest
    env:
      # Newest build actually published to cli.crossplane.io. GitHub tags v2.4.2
      # and v2.4.3 are not on that bucket, so install.sh rejects them.
      XP_VERSION: v2.4.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: examples/03-xrd-composition-bucket
          - dir: examples/04-patch-and-transform
          - dir: examples/05-app-with-deployment
          - dir: examples/07-multi-resource-composition
          - dir: examples/08-application
          - dir: my-platform
            xr: ../examples/07-multi-resource-composition/xr.yaml
            functions: ../examples/07-multi-resource-composition/functions.yaml
    name: render (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@v5
      - name: Install Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh | sh
          sudo mv crossplane /usr/local/bin/
          crossplane version --client
      - name: crossplane render
        working-directory: ${{ matrix.dir }}
        run: crossplane render ${{ matrix.xr || 'xr.yaml' }} composition.yaml ${{ matrix.functions || 'functions.yaml' }}
