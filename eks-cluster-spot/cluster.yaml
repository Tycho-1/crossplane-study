# EKS control plane in eu-central-1. The AWS cluster name is metadata.name.
# Role and subnets are resolved by reference — no IDs or ARNs to copy.
apiVersion: eks.aws.m.upbound.io/v1beta1
kind: Cluster
metadata:
  name: my-eks-cluster
  namespace: eks-spot
spec:
  forProvider:
    region: eu-central-1
    version: "1.34"
    roleArnRef:
      name: eks-cluster-role
    accessConfig:
      authenticationMode: API
      # Grants cluster-admin to the IAM identity in aws-secret (the one Crossplane uses).
      bootstrapClusterCreatorAdminPermissions: true
    vpcConfig:
      endpointPublicAccess: true
      subnetIdRefs:
        - name: eks-public-1a
        - name: eks-public-1b
        - name: eks-public-1c
