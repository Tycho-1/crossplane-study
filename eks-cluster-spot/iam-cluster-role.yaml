# EKS cluster IAM role (trust eks.amazonaws.com + AmazonEKSClusterPolicy).
# Referenced by cluster.yaml via roleArnRef. The AWS role name is metadata.name.
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: Role
metadata:
  name: eks-cluster-role
  namespace: eks-spot
spec:
  forProvider:
    description: IAM role for EKS cluster control plane
    forceDetachPolicies: true
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": { "Service": "eks.amazonaws.com" },
            "Action": "sts:AssumeRole"
          }
        ]
      }
    managedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
