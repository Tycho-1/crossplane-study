# VPC for EKS in eu-central-1. Subnets and routing reference it via vpcIdRef.
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: VPC
metadata:
  name: eks-vpc
  namespace: eks-spot
spec:
  forProvider:
    region: eu-central-1
    cidrBlock: 10.0.0.0/16
    enableDnsSupport: true
    enableDnsHostnames: true
    tags:
      Name: eks-spot-vpc
