# EKS node group IAM role (trust ec2.amazonaws.com + EKS worker policies).
# Referenced by nodegroup-spot.yaml via nodeRoleArnRef. The AWS role name is metadata.name.
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: Role
metadata:
  name: eks-node-role
  namespace: eks-spot
spec:
  forProvider:
    description: IAM role for EKS managed node group
    forceDetachPolicies: true
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": { "Service": "ec2.amazonaws.com" },
            "Action": "sts:AssumeRole"
          }
        ]
      }
    managedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
      - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
      - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
