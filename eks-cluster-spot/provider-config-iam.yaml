# Shared AWS config: provider-aws-iam does NOT install ProviderConfig/ClusterProviderConfig in
# iam.aws.upbound.io; it uses the shared config from aws.m.upbound.io (same as S3, EKS, etc.).
# Apply this once so "default" exists (or use ../provider-config.yaml). Secret aws-secret in crossplane-system.
apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-secret
      key: creds
