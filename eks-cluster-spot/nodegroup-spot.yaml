# EKS managed node group with SPOT capacity. AWS starts creating it only once the
# cluster is ACTIVE; applying it earlier is fine — Crossplane retries until then.
apiVersion: eks.aws.m.upbound.io/v1beta1
kind: NodeGroup
metadata:
  name: my-eks-spot-nodegroup
  namespace: eks-spot
spec:
  forProvider:
    region: eu-central-1
    clusterNameRef:
      name: my-eks-cluster
    nodeRoleArnRef:
      name: eks-node-role
    subnetIdRefs:
      - name: eks-public-1a
      - name: eks-public-1b
      - name: eks-public-1c
    capacityType: SPOT
    amiType: AL2023_x86_64_STANDARD
    # Several similar instance types = more Spot pools = fewer interruptions.
    instanceTypes:
      - t3.medium
      - t3a.medium
    scalingConfig:
      minSize: 1
      maxSize: 5
      desiredSize: 2
