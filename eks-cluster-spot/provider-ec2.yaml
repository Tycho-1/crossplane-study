# Upbound provider-aws-ec2 (VPC, Subnet, InternetGateway, RouteTable, Route, ...).
# Installs upbound-provider-family-aws as a dependency (ClusterProviderConfig API).
# Keep all Upbound AWS providers on the same version — see guides/18_AWS_Family_Contrib_vs_Upbound.md.
# Wait until: kubectl get providers.pkg.crossplane.io → INSTALLED=True, HEALTHY=True
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-ec2
spec:
  package: xpkg.upbound.io/upbound/provider-aws-ec2:v2.5.0
