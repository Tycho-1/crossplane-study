# Functions used by the Composition pipeline.
# Apply before composition.yaml so they are installed when the pipeline runs.
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.10.1
---
# Marks XR as READY when all composed resources are ready (Deployment: readyReplicas, Service, ConfigMap).
# Without this, XR stays READY: False because Crossplane doesn't infer readiness for plain K8s resources.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.6.0
