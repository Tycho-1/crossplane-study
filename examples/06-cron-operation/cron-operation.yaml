# CronOperation: run a function pipeline on a schedule (alpha)
# Schedule: daily at 6 AM. Pipeline runs e.g. cert check or report.
apiVersion: ops.crossplane.io/v1alpha1
kind: CronOperation
metadata:
  name: cert-monitor
spec:
  schedule: "0 6 * * *"   # Cron: minute 0, hour 6, every day
  operationTemplate:      # each run creates an Operation from this template
    spec:
      mode: Pipeline
      pipeline:
        - step: check-certificates
          functionRef:
            name: crossplane-contrib-function-python
          # input would define the script; function checks certs and reports status
